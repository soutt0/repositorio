# att as secrets do SONAR -> projectKey, host e o token
# pegando novamente a informação da chave .pem e colocando no secrets
name: CI/CD Pipeline - SonarQube + OWASP ZAP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo - SonarQube usa isso para detectar codigo novo/alterado

      - name: Check SonarQube availability
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST }}
        run: |
          curl --fail --silent --show-error --connect-timeout 15 \
            "$SONAR_HOST_URL/api/system/status"

      - name: Run SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_LOGIN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST }}
        with:
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECTKEY }}
            -Dsonar.sources=.

  owasp-zap-scan:
    name: OWASP ZAP Baseline Scan
    needs: sonarqube-analysis   # só roda se o job do SonarQube passar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write            # a action abre e atualiza uma issue no repo com os alertas encontrados
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://${{ secrets.HOST }}:3000'
          fail_action: false   # nao derruba o pipeline por causa dos alertas (mudar para true se qquiser bloquear o merge)
