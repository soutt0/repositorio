# att as secrets do SONAR -> projectKey, host e o token
# pegando novamente a informação da chave .pem e colocando no secrets
name: CI/CD Pipeline - SonarQube + OWASP ZAP

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows: ["Deploy to Production in AWS Aula DevSecOps"]
    types: [completed]

jobs:
  sonarqube-analysis:
    name: SonarQube Analysis
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo - SonarQube usa isso para detectar codigo novo/alterado
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check SonarQube availability
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST }}
        run: |
          for attempt in {1..30}; do
            status=$(curl --silent --show-error --connect-timeout 10 \
              "$SONAR_HOST_URL/api/system/status" 2>/dev/null || true)
            echo "Status atual do SonarQube: ${status:-indisponivel}"
            if printf '%s' "$status" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              exit 0
            fi
            echo "SonarQube ainda nao esta acessivel (tentativa $attempt/30)."
            sleep 10
          done
          echo "SonarQube nao ficou acessivel a tempo."
          exit 1

      - name: Run SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_LOGIN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST }}
        with:
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECTKEY }}
            -Dsonar.sources=.
            -Dsonar.scanner.skipJreProvisioning=true

  owasp-zap-scan:
    name: OWASP ZAP Baseline Scan
    needs: sonarqube-analysis   # só roda se o job do SonarQube passar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write            # a action abre e atualiza uma issue no repo com os alertas encontrados
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://${{ secrets.HOST }}:3000'
          fail_action: false   # nao derruba o pipeline por causa dos alertas (mudar para true se qquiser bloquear o merge)
