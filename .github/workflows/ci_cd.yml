# Versão corrigida do professor ainda preciso arrumar a EC2, colocando mais memoria
# ou trocar o tipo da EC2, para rodar o SonarQube, OWASP ZAP ao mesmo tempo,
# no momento com apenas 1Giga de memoria RAM e com processador fraco o docker não consegue
# nem criar a EC2, depois excluir esse comentario e fazer o push para testar tudo isso na EC2

name: CI/CD Pipeline with SonarQube and ZAP
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar_scan:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SonarQube Scanner
        run: |
          curl -Lo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.7.0.2747-linux.zip
          unzip sonar-scanner.zip
          mv sonar-scanner-4.7.0.2747-linux sonar-scanner
          echo "$(pwd)/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Run SonarQube Analysis
        run: |
          sonar-scanner \
            -Dsonar.projectKey=nodepipeline-devops \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://54.91.17.153:9000 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  zap_scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: sonar_scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://<url-da-aplicacao-a-testar>'