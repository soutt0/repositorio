filebeat.inputs:
  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          host: unix:///var/run/docker.sock
      - drop_event:
          when:
            regexp:
              container.name: ".*(logstash|filebeat).*"

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info